<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Moodboard">
  <title>Moodboard</title>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" ry="112" fill="#1e1e1e"/>
  <!-- Collage: cuatro tarjetas con leve rotación y separación oscura -->
  <g stroke="#1e1e1e" stroke-width="12" stroke-linejoin="round">
    <rect x="96" y="134" width="172" height="228" rx="16" fill="#f2f2f2" transform="rotate(-7 182 248)"/>
    <rect x="244" y="94" width="176" height="146" rx="16" fill="#ff3b30" transform="rotate(6 332 167)"/>
    <rect x="266" y="266" width="156" height="152" rx="16" fill="#ffcc00" transform="rotate(-5 344 342)"/>
    <rect x="114" y="330" width="126" height="92" rx="16" fill="#34c759" transform="rotate(9 177 376)"/>
  </g>
</svg>
