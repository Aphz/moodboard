<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moodboard" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="description" content="Tablero de referencias visuales para iPhone e iPad" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Moodboard</title>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas" aria-label="Lienzo"></canvas>
      <div id="empty-hint" hidden></div>
      <div id="top-bar"></div>
      <div id="toolbar"></div>
      <div id="sub-bar" hidden></div>
      <aside id="hierarchy" hidden></aside>
      <div id="overlay-root"></div>
      <div id="toast-root"></div>
    </div>
    <input id="file-input" type="file" accept="image/*,.moodboard,.zip,application/zip" multiple hidden />
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
